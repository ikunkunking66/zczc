<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandas Web Lab · 在线数据分析平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E8F7C'/%3E%3Ccircle cx='32' cy='33' r='20' fill='white'/%3E%3Ccircle cx='15' cy='13' r='9' fill='%23141C2B'/%3E%3Ccircle cx='49' cy='13' r='9' fill='%23141C2B'/%3E%3Cellipse cx='25' cy='32' rx='6' ry='7.5' fill='%23141C2B'/%3E%3Cellipse cx='39' cy='32' rx='6' ry='7.5' fill='%23141C2B'/%3E%3Ccircle cx='25' cy='32' r='2.2' fill='white'/%3E%3Ccircle cx='39' cy='32' r='2.2' fill='white'/%3E%3Ccircle cx='32' cy='44' r='3.4' fill='%23141C2B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --canvas:#EEF1F6; --panel:#FFFFFF; --panel2:#FBFCFE;
  --ink:#141C2B; --ink2:#3A4659; --muted:#67748C;
  --line:#E3E8F0; --line2:#D4DCE7;
  --primary:#0E8F7C; --primary-d:#0B7767; --primary-t:#E3F5F1;
  --accent:#E2912B; --accent-d:#9A6410; --accent-t:#FBF0DD;
  --danger:#C3442F; --danger-t:#FBEBE6;
  --info:#4C6FD4; --info-t:#E9EDFB;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --shadow-lg:0 4px 8px rgba(16,24,40,.08),0 24px 56px rgba(16,24,40,.16);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 2px 6px rgba(16,24,40,.05),0 14px 34px -18px rgba(16,24,40,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font); color:var(--ink); background:
  radial-gradient(1100px 500px at 100% -8%, rgba(14,143,124,.06), transparent 60%),
  radial-gradient(900px 420px at -6% 108%, rgba(76,111,212,.06), transparent 55%),
  linear-gradient(180deg,#F2F5FA 0%,#ECF0F6 100%);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(620px 420px at 10% 16%, rgba(14,143,124,.05), transparent 62%),
  radial-gradient(720px 460px at 90% 30%, rgba(76,111,212,.055), transparent 62%),
  radial-gradient(560px 400px at 52% 94%, rgba(226,145,43,.04), transparent 62%)}
::selection{background:rgba(14,143,124,.22)}
*{scrollbar-width:thin; scrollbar-color:rgba(103,116,140,.35) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:rgba(103,116,140,.3); border-radius:8px; border:2px solid transparent; background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(103,116,140,.5); background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
#app{display:flex; flex-direction:column; height:100%}

/* ============ Topbar ============ */
.topbar{height:56px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px; background:rgba(255,255,255,.84); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid rgba(227,232,240,.9); box-shadow:0 1px 2px rgba(16,24,40,.03); position:relative; z-index:40}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand .mark{width:30px; height:30px; flex:none; filter:drop-shadow(0 3px 6px rgba(14,143,124,.3))}
.brand .name{font-weight:600; font-size:15px; white-space:nowrap; font-family:var(--mono); letter-spacing:.01em}
.brand .sub{font-size:11.5px; color:var(--muted); white-space:nowrap; display:none}
.spacer{flex:1}
.ds-chip{display:flex; align-items:center; gap:6px; padding:5px 10px; background:var(--primary-t); color:var(--primary-d); border-radius:999px; font-size:12.5px; font-weight:600; max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-shadow:inset 0 0 0 1px rgba(14,143,124,.16)}
.ds-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--primary); flex:none; box-shadow:0 0 0 3px rgba(14,143,124,.15)}
.seg{display:flex; background:linear-gradient(180deg,#F3F5F9,#EAEEF4); border:1px solid var(--line2); border-radius:11px; padding:3px; flex:none; box-shadow:inset 0 1px 3px rgba(16,24,40,.05)}
.seg button{padding:5px 11px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted); min-height:28px; transition:all .15s}
.seg button.on{background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(16,24,40,.12)}
.tb-btn{display:flex; align-items:center; gap:6px; padding:7px 11px; border:1px solid var(--line2); border-radius:10px; background:linear-gradient(180deg,#fff,#F8FAFC); font-size:13px; font-weight:600; color:var(--ink2); min-height:34px; transition:all .15s; flex:none; box-shadow:0 1px 2px rgba(16,24,40,.04), inset 0 1px 0 rgba(255,255,255,.85)}
.tb-btn:hover{border-color:var(--primary); color:var(--primary-d); background:linear-gradient(180deg,#fff,#EFF9F6)}
.tb-btn:active{transform:translateY(1px)}
.tb-btn svg{width:15px; height:15px}
.tb-btn .cnt{background:var(--danger); color:#fff; border-radius:999px; font-size:11px; min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 5px; font-weight:700}
.tb-btn:disabled{opacity:.4; cursor:not-allowed}
.hamburger{display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:9px; color:var(--muted); flex:none}
.hamburger:hover{background:var(--canvas)}
.hamburger svg{width:20px; height:20px}

/* ============ Shell / Sidebar ============ */
.shell{flex:1; display:flex; min-height:0}
.sidebar{width:236px; flex:none; background:linear-gradient(180deg,#FFFFFF,#FBFCFE); border-right:1px solid var(--line); overflow-y:auto; padding:16px 10px 26px}
.sg{font-size:11.5px; font-weight:700; color:var(--muted); padding:16px 10px 6px; letter-spacing:.08em; display:flex; align-items:center; gap:7px}
.sg::before{content:'';width:3px; height:12px; border-radius:2px; background:var(--primary); opacity:.65}
.si{display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border-radius:9px; font-size:13.5px; color:var(--ink2); text-align:left; transition:background .15s,transform .12s,box-shadow .15s; min-height:36px; position:relative}
.si:hover{background:var(--canvas); transform:translateX(2px)}
.si.on{background:linear-gradient(90deg,var(--primary-t),#F4FBF9); color:var(--primary-d); font-weight:600; box-shadow:inset 2px 0 0 var(--primary)}
.si svg{width:16px; height:16px; flex:none; color:var(--muted)}
.si.on svg{color:var(--primary)}
.si .tag{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted); opacity:.75; font-weight:500}
.si.on .tag{opacity:1}

/* ============ Main ============ */
.main{flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; padding:16px; overflow-y:auto}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.stat{position:relative; overflow:hidden; background:linear-gradient(180deg,#fff,#FBFCFE); border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px; box-shadow:var(--shadow-sm); min-height:80px; transition:transform .16s,box-shadow .16s}
.stat:hover{transform:translateY(-2px); box-shadow:var(--shadow-md)}
.stat::after{content:'';position:absolute; right:-26px; top:-26px; width:86px; height:86px; border-radius:50%; background:radial-gradient(circle,var(--glow,rgba(14,143,124,.09)), transparent 70%); pointer-events:none}
.stat-top{display:flex; align-items:center; gap:11px}
.tile{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; background:var(--tc,#0E8F7C); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25), 0 5px 12px -4px rgba(16,24,40,.3); flex:none}
.tile svg{width:18px; height:18px}
.stat .lab{font-size:12px; color:var(--muted)}
.stat .val{font-family:var(--mono); font-size:20px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums}
.stat .val small{font-size:12px; color:var(--muted); font-weight:400; margin-left:2px}
.stat .bar{height:3px; width:100%; border-radius:2px; margin-top:12px; background:linear-gradient(90deg,var(--bc,var(--primary)),transparent); opacity:.85}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(16,24,40,.03),0 14px 30px -20px rgba(16,24,40,.16); display:flex; flex-direction:column; min-height:0}
.card-h{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex:none; background:linear-gradient(180deg,#fff,#FBFCFE); border-radius:16px 16px 0 0}
.card-h h3{font-size:14px; margin:0; font-weight:700; display:flex; align-items:center; gap:8px}
.card-h h3::before{content:''; width:4px; height:14px; border-radius:2px; background:var(--primary); opacity:.85}
.card-h .sub{margin-left:auto; font-size:12px; color:var(--muted); font-family:var(--mono)}
.table-card{flex:1; min-height:280px}
.result-card{flex:1; min-height:330px}

/* ============ Table ============ */
.tbl-wrap{flex:1; overflow:auto; min-height:120px}
table.grid{border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed; font-size:13px}
.grid th{position:sticky; top:0; z-index:3; background:linear-gradient(180deg,#F8FAFD,#EFF3F8); border-bottom:1px solid var(--line); border-right:1px solid rgba(212,220,231,.7); padding:0; height:38px; text-align:left; font-weight:600; color:var(--ink2); white-space:nowrap; user-select:none}
.grid th .thc{display:flex; align-items:center; gap:6px; padding:8px 10px; height:100%}
.grid th.sortable{cursor:pointer}
.grid th.sortable:hover{background:#E9EFF6}
.grid th .sort-ind{font-family:var(--mono); font-size:10px; color:var(--primary); width:12px; flex:none}
.grid th.num{text-align:right}
.grid th.num .thc{justify-content:flex-end}
.grid th .tchip{display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; padding:1.5px 7px; border-radius:6px; color:#5B6B80; font-family:var(--mono); flex:none; letter-spacing:.04em}
.tchip.n{background:var(--info-t); color:var(--info); box-shadow:inset 0 0 0 1px rgba(76,111,212,.18)}
.tchip.s{background:#EEF2F7; color:#556; box-shadow:inset 0 0 0 1px rgba(85,102,102,.12)}
.tchip.d{background:var(--accent-t); color:var(--accent-d); box-shadow:inset 0 0 0 1px rgba(226,145,43,.2)}
.grid td{border-bottom:1px solid #EFF2F7; border-right:1px solid #F0F3F8; padding:0; height:34px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:cell; transition:background .1s}
.grid td .tdc{padding:6px 10px; display:block; overflow:hidden; text-overflow:ellipsis}
.grid tbody tr:nth-child(even) td{background:#FBFCFE}
.grid tbody tr:hover td{background:#F0F8F6}
.grid td:hover{background:#E6F5F1}
.grid td.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.grid td.idx{color:var(--muted); font-family:var(--mono); background:linear-gradient(180deg,#FBFCFE,#F7F9FC); text-align:right; font-size:12px; cursor:default}
.grid td .null{display:inline-flex; align-items:center; background:var(--accent-t); color:var(--accent-d); font-size:11px; font-weight:600; padding:1px 7px; border-radius:6px; font-family:var(--mono); box-shadow:inset 0 0 0 1px rgba(226,145,43,.22)}
.grid td .val-str{color:var(--ink2)}
.grid .cell-edit{width:100%; height:100%; border:2px solid var(--primary); border-radius:6px; padding:5px 9px; font:inherit; font-family:var(--mono); background:#fff; outline:none}
.grid col.idxcol{width:54px}

/* ============ Pager ============ */
.pager{display:flex; align-items:center; gap:8px; padding:8px 16px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); flex:none; background:linear-gradient(180deg,#FCFDFE,#F8FAFC); border-radius:0 0 16px 16px}
.pager .info{margin-right:auto; font-family:var(--mono)}
.pager button{min-width:30px; height:28px; border:1px solid var(--line2); border-radius:8px; background:var(--panel); font-size:12px; display:flex; align-items:center; justify-content:center; color:var(--ink2); transition:all .12s; box-shadow:0 1px 2px rgba(16,24,40,.04)}
.pager button:hover{border-color:var(--primary); color:var(--primary-d); background:#F2FBF9}
.pager button:disabled{opacity:.35; cursor:not-allowed; box-shadow:none}

/* ============ Tabs / Result ============ */
.tabs{display:flex; gap:2px; padding:10px 14px 0; flex:none}
.tabbar{display:inline-flex; gap:5px; background:linear-gradient(180deg,#F3F5F9,#EAEEF4); border:1px solid var(--line); border-radius:12px; padding:4px; box-shadow:inset 0 1px 3px rgba(16,24,40,.04)}
.tab{display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted); min-height:34px; transition:all .15s}
.tab svg{width:14px; height:14px}
.tab:hover{color:var(--ink2)}
.tab.on{background:var(--panel); color:var(--primary-d); box-shadow:0 1px 3px rgba(16,24,40,.1), inset 0 0 0 1px var(--line2)}
.tab-body{padding:14px 16px; overflow:auto; flex:1; min-height:0}
.res-note{font-size:12px; color:var(--muted); margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
.res-note .tag{font-family:var(--mono); background:var(--primary-t); color:var(--primary-d); border:none; border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:600}
.log-item{display:flex; gap:9px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:baseline}
.log-item .tm{font-family:var(--mono); color:var(--muted); flex:none; font-size:11px}
.log-item .msg{color:var(--ink2); word-break:break-word}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:44px 20px; color:var(--muted); border:1.5px dashed var(--line2); border-radius:var(--r-md); background:linear-gradient(180deg,#FDFEFF,#F8FAFD); text-align:center}
.empty svg{width:38px; height:38px; opacity:1; color:var(--primary); padding:8px; box-sizing:content-box; border-radius:12px; background:var(--primary-t)}
.empty .btn{margin-top:4px}

/* ============ Chart ============ */
.ctl{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding-bottom:12px}
.field{display:flex; flex-direction:column; gap:5px; min-width:110px}
.field.grow{flex:1; min-width:130px}
.field label{font-size:12px; color:var(--muted); font-weight:600}
.in{border:1px solid var(--line2); border-radius:8px; padding:7px 10px; font-size:13.5px; background:#FDFEFF; min-width:0; height:34px; transition:border-color .15s,box-shadow .15s,background .15s}
.in:hover{border-color:#B9C4D4}
.in:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(14,143,124,.14); outline:none}
.in[type=checkbox]{width:16px; height:16px; accent-color:var(--primary); padding:0}
.in-multi{height:auto; min-height:34px}
#chartBox{width:100%; height:360px; background:radial-gradient(circle, rgba(16,24,40,.05) 1px, transparent 1px), var(--panel2); background-size:16px 16px,auto; border:1px solid var(--line); border-radius:var(--r-md); box-shadow:inset 0 1px 4px rgba(16,24,40,.04)}

/* ============ Form / Modal ============ */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:5px 10px; border:1px solid var(--line2); border-radius:8px; font-size:12.5px; color:var(--ink2); background:var(--panel); min-height:28px; transition:all .12s; box-shadow:0 1px 1px rgba(16,24,40,.03)}
.chip:hover{border-color:var(--primary); color:var(--primary-d)}
.chip.on{background:var(--primary-t); border-color:var(--primary); color:var(--primary-d); font-weight:600; box-shadow:inset 0 0 0 1px rgba(14,143,124,.2)}
.chip.danger.on{background:var(--danger-t); border-color:var(--danger); color:var(--danger)}
.m-group{border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-bottom:12px; background:linear-gradient(180deg,#FCFDFE,#F9FAFD)}
.m-group .g-t{font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:9px; display:flex; align-items:center; gap:6px}
.m-group .g-t svg{width:14px; height:14px; color:var(--primary)}
.row-line{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap}
.row-line .in{flex:1; min-width:90px}
.hint{font-size:12px; color:var(--muted); background:var(--canvas); border:1px dashed var(--line2); padding:8px 10px; border-radius:8px; margin-top:10px}
.icon-btn{width:30px; height:30px; border-radius:7px; border:1px solid var(--line2); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none; background:var(--panel); transition:all .12s}
.icon-btn:hover{background:var(--canvas); color:var(--ink); border-color:#C3CEDA}
.icon-btn.danger:hover{background:var(--danger-t); color:var(--danger); border-color:transparent}
.icon-btn svg{width:15px; height:15px}
.check-line{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2); padding:3px 0}
.check-line input{width:16px; height:16px; accent-color:var(--primary)}

.modal-overlay{position:fixed; inset:0; background:rgba(16,24,40,.5); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px}
.modal-overlay[hidden]{display:none}
.modal{background:var(--panel); border-radius:var(--r-lg); width:min(680px,96vw); max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:pop .18s ease; overflow:hidden}
.modal::before{content:'';flex:none;height:3px;background:linear-gradient(90deg,#0E8F7C,#4C6FD4 65%,rgba(76,111,212,0));border-radius:16px 16px 0 0}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98)}}
.m-head{display:flex; align-items:center; padding:15px 20px 12px; border-bottom:1px solid var(--line); flex:none}
.m-head h3{margin:0; font-size:15.5px}
.m-head .mono{font-size:11.5px; color:var(--muted); margin-left:10px; font-family:var(--mono); background:var(--canvas); padding:2px 8px; border-radius:6px}
.m-close{margin-left:auto; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none}
.m-close:hover{background:var(--canvas)}
.m-close svg{width:17px; height:17px}
.m-body{padding:16px 20px; overflow-y:auto; min-height:0}
.m-foot{display:flex; gap:10px; justify-content:flex-end; align-items:center; padding:12px 20px; border-top:1px solid var(--line); background:#FAFBFD; border-radius:0 0 var(--r-lg) var(--r-lg); flex:none}
.m-foot .hint{margin:0 auto 0 0; border:none; background:none; padding:0}

/* ============ Toast ============ */
#toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:300; max-width:min(380px,92vw)}
.toast{background:#16202E; color:#EAF0F7; padding:10px 14px; border-radius:10px; font-size:13px; box-shadow:var(--shadow-lg); display:flex; gap:9px; align-items:flex-start; animation:tin .2s ease; word-break:break-word}
.toast .dot{width:8px; height:8px; border-radius:50%; background:var(--primary); flex:none; margin-top:5px}
.toast.err .dot{background:var(--danger)}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}

.btn{padding:8px 16px; border-radius:9px; font-size:13.5px; font-weight:600; border:1px solid var(--line2); background:linear-gradient(180deg,#fff,#F8FAFC); color:var(--ink2); min-height:36px; display:inline-flex; align-items:center; gap:7px; justify-content:center; transition:all .15s; box-shadow:0 1px 2px rgba(16,24,40,.05), inset 0 1px 0 rgba(255,255,255,.85)}
.btn:hover{border-color:var(--primary); color:var(--primary-d); background:linear-gradient(180deg,#fff,#EFF9F6)}
.btn svg{width:15px; height:15px}
.btn.primary{background:linear-gradient(135deg,#10A48E,#0B7767); border-color:#0B7767; color:#fff; box-shadow:0 5px 14px -4px rgba(14,143,124,.55)}
.btn.primary:hover{background:linear-gradient(135deg,#0E8F7C,#096B5D); color:#fff}
.btn.danger{color:var(--danger); border-color:#F2CBC3; background:#fff}
.btn.danger:hover{background:var(--danger-t); color:var(--danger)}
.btn.sm{padding:4px 10px; font-size:12.5px; min-height:28px; border-radius:7px; gap:5px}
.btn .lbl-mobile{display:inline}

/* ============ Responsive ============ */

<div id="app">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0E8F7C"/><circle cx="32" cy="33" r="20" fill="white"/><circle cx="15" cy="13" r="9" fill="#141C2B"/><circle cx="49" cy="13" r="9" fill="#141C2B"/><ellipse cx="25" cy="32" rx="6" ry="7.5" fill="#141C2B"/><ellipse cx="39" cy="32" rx="6" ry="7.5" fill="#141C2B"/><circle cx="25" cy="32" r="2.2" fill="white"/><circle cx="39" cy="32" r="2.2" fill="white"/><circle cx="32" cy="44" r="3.4" fill="#141C2B"/></svg>
      <span class="name">Pandas Web Lab</span>
      <span class="sub">· 在线数据分析平台 · Visual Data Lab</span>
    </div>
    <div class="spacer"></div>
    <div class="ds-chip" id="dsChip"><span class="dot"></span><span id="dsName">—</span></div>
    <button class="tb-btn" id="undoBtn" onclick="doUndo()" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      <span class="lbl">Undo</span><span class="cnt" id="undoCnt" style="display:none">0</span>
    </button>
    <button class="tb-btn" id="resetBtn" onclick="resetData()" title="Reset to default dataset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span class="lbl" id="resetLbl">Reset</span>
    </button>
    <button class="tb-btn" id="expCsv" onclick="exportCSV()" title="Export CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span class="lbl" id="expCsvLbl">CSV</span>
    </button>
    <button class="tb-btn" id="expJson" onclick="exportJSON()" title="Export JSON">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M8 12 12 8m-4 4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span class="lbl" id="expJsonLbl">JSON</span>
    </button>
    <div class="seg" role="group" aria-label="Language">
      <button id="langCn" onclick="setLang('cn')">中文</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <section class="stats" id="stats"></section>
      <section class="card table-card">
        <div class="card-h">
          <h3 id="tblTitle">DataFrame</h3>
          <span class="sub" id="tblSub"></span>
        </div>
        <div class="tbl-wrap" id="tblWrap"></div>
        <div class="pager" id="pager"></div>
      </section>
      <section class="card result-card">
        <div class="tabs" id="tabs"></div>
        <div class="tab-body" id="tabBody">
          <div id="resArea"></div>
          <div id="chartArea" style="display:none"></div>
          <div id="logArea" style="display:none"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>

    <div class="m-foot" id="mFoot"></div>
  </div>
</div>

============================================================ */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n){ if(n===null||n===undefined||n==='') return '—'; if(typeof n==='number'){ if(!isFinite(n)) return '—'; const r=Math.round(n*10000)/10000; return r.toLocaleString('en-US'); } return String(n); }
function now(){ const d=new Date(); const p=x=>String(x).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function toast(msg,err){ const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.innerHTML='<span class="dot"></span><span>'+esc(msg)+'</span>'; document.getElementById('toasts').appendChild(el); setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),320); },2600); }
function log(msg){ LOG.unshift({tm:now(),msg}); if(LOG.length>200)LOG.pop(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pushUndo(label){ UNDO.push({label, df:clone(DF), name:DF_NAME}); if(UNDO.length>50)UNDO.shift(); renderTopbar(); }
function setData(df,name){ DF=df; DF_NAME=name||DF_NAME; PAGE=0; HDR_SORT={idx:-1,dir:'none'}; }
function applyMutation(label, df, msg){ pushUndo(label); setData(df,DF_NAME); log(label); renderAll(); if(msg)toast(msg); }
function coerceCell(v,type){ if(v===null||v==='') return null; if(type==='n'){ const n=Number(v); return isNaN(n)?null:n; } if(type==='d'){ const d=parseDate(v); return d||String(v); } return String(v); }
function parseDate(v){ const s=String(v).trim(); const m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/); if(!m)return null; const p=x=>String(x).padStart(2,'0'); return m[1]+'-'+p(m[2])+'-'+p(m[3])+(m[4]?(' '+p(m[4])+':'+p(m[5]||0)+(m[6]?(':'+p(m[6])):'')):''); }

/* ============================================================
   DataFrame 核心 · pandas 语义
============================================================ */
function inferType(vals){ const ns=vals.filter(v=>v!==null&&v!==''&&v!==undefined); if(!ns.length)return 's';

function renderSidebar(){ const sb=document.getElementById('sidebar'); let h='';

function renderStats(){ const el=document.getElementById('stats'); if(!DF){ el.innerHTML=''; return; }
  const info=dfInfo(DF); const num=DF.types.filter(x=>x==='n').length;
  const items=[
    {lab:'sRows',ic:ICONS.rows,val:DF.rows.length,u:UNITS[0],c:'#0E8F7C',glow:'rgba(14,143,124,.10)'},
    {lab:'sCols',ic:ICONS.cols,val:DF.columns.length,u:UNITS[1],c:'#4C6FD4',glow:'rgba(76,111,212,.10)'},
    {lab:'sMissing',ic:ICONS.missing,val:info.nullTotal,u:UNITS[2],c:'#E2912B',glow:'rgba(226,145,43,.10)'},
    {lab:'sNumeric',ic:ICONS.numeric,val:num,u:UNITS[3],c:'#7A5FD0',glow:'rgba(122,95,208,.10)'}
  ];
  el.innerHTML=items.map(it=>'<div class="stat" style="--glow:'+it.glow+'"><div class="stat-top">'+
    '<span class="tile" style="--tc:'+it.c+'">'+it.ic+'</span>'+
    '<div class="stat-txt"><div class="lab">'+esc(t(it.lab))+'</div><div class="val">'+fmt(it.val)+' <small>'+it.u+'</small></div></div></div>'+
    '<div class="bar" style="--bc:'+it.c+'"></div></div>').join(''); }
function emptyHTML(){ return '<div class="empty">'+ICONS.data+'<div>'+esc(t('mNoData'))+'</div><div class="row-line" style="justify-content:center"><button class="btn primary" onclick="loadDefault()">'+esc(t('tLoadDefault'))+'</button><button class="btn" onclick="triggerUpload()">'+esc(t('tUpload'))+'</button></div></div>'; }
function renderTable(){ const wrap=document.getElementById('tblWrap');
  if(!DF||!DF.rows.length){ wrap.innerHTML=DF?('<div class="empty">'+ICONS.data+'<div>'+esc(t('mNoData'))+'</div></div>'):emptyHTML(); document.getElementById('pager').innerHTML=''; return; }
  const n=DF.rows.length,pages=Math.max(1,Math.ceil(n/PAGE_SIZE)); if(PAGE>pages-1)PAGE=pages-1;
  const start=PAGE*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,n),slice=DF.rows.slice(start,end);
  const colW=DF.columns.length?('calc((100% - 54px)/'+DF.columns.length+')'):'0px';
  let h='<table class="grid"><colgroup><col class="idxcol">'+DF.columns.map(()=>'<col style="width:'+colW+'">').join('')+'</colgroup><thead><tr><th class="idx"></th>';
  DF.columns.forEach((c,i)=>{ const dir=HDR_SORT.idx===i?HDR_SORT.dir:'none'; const ind=dir==='asc'?'▲':dir==='desc'?'▼':'';
    const tch=DF.types[i]==='n'?'<span class="tchip n">N</span>':DF.types[i]==='d'?'<span class="tchip d">D</span>':'<span class="tchip s">S</span>';
    h+='<th class="'+(DF.types[i]==='n'?'num':'')+'" onclick="headerSort('+i+')"><span class="thc"><span class="sort-ind">'+ind+'</span><span>'+esc(c)+'</span>'+tch+'</span></th>'; });
  h+='</tr></thead><tbody>';
  slice.forEach((r,ri)=>{ const gi=start+ri; h+='<tr><td class="tdc idx">'+gi+'</td>';
    r.forEach((v,ci)=>{ const cls=DF.types[ci]==='n'?'num':''; const click='onclick="startEdit('+gi+','+ci+')"';
      if(v===null||v==='')h+='<td class="'+cls+'" '+click+'><span class="tdc"><span class="null">null</span></span></td>';
      else if(typeof v==='number')h+='<td class="'+cls+'" '+click+'><span class="tdc">'+fmt(v)+'</span></td>';
      else h+='<td class="'+cls+'" '+click+'><span class="tdc val-str">'+esc(v)+'</span></td>'; });
    h+='</tr>'; });
  h+='</tbody></table>'; wrap.innerHTML=h;
  document.getElementById('tblSub').textContent=t('tblSub',{name:DF_NAME,r:n,c:DF.columns.length});
  document.getElementById('tblTitle').textContent=t('tblTitle'); renderPager(); }
function renderPager(){ const el=document.getElementById('pager'); if(!DF||!DF.rows.length){ el.innerHTML=''; return; }
  const n=DF.rows.length,pages=Math.max(1,Math.ceil(n/PAGE_SIZE));
  const start=PAGE*PAGE_SIZE+1,end=Math.min(n,(PAGE+1)*PAGE_SIZE);
  el.innerHTML='<span class="info">'+t('pShow',{a:start,b:end,t:n})+'</span>'+
    '<button onclick="pageTo('+(PAGE-1)+')" '+(PAGE<=0?'disabled':'')+'>'+ICONS.prev+'</button>'+
    '<span class="info">'+t('pPage',{p:PAGE+1,n:pages})+'</span>'+
    '<button onclick="pageTo('+(PAGE+1)+')" '+(PAGE>=pages-1?'disabled':'')+'>'+ICONS.next+'</button>'; }
function pageTo(p){ PAGE=Math.max(0,Math.min(p,Math.ceil((DF?DF.rows.length:0)/PAGE_SIZE)-1)); renderTable(); }
function headerSort(ci){ if(!DF)return;
  const cur=HDR_SORT.idx===ci?HDR_SORT.dir:'none'; const next=cur==='none'?'asc':cur==='asc'?'desc':'none';
  pushUndo(t('tSort'));
  if(next==='none'){ setData(makeDF(DF.columns,DF.orig),DF_NAME); log(t('tSort')+' · reset'); toast(t('mSortOk')); }
  else{ setData(dfSort(DF,[{col:ci,asc:next==='asc'}]),DF_NAME); log(t('tSort')+' · '+t(next==='asc'?'asc':'desc')); toast(t('mSortOk')); }
  HDR_SORT={idx:ci,dir:next}; renderTable(); }
function startEdit(gi,ci){ const wrap=document.getElementById('tblWrap');
  const rows=wrap.querySelectorAll('tbody tr'); const pageRow=gi-PAGE*PAGE_SIZE; if(pageRow<0||pageRow>=rows.length)return;
  const cells=rows[pageRow].querySelectorAll('td'); const td=cells[ci+1]; if(!td)return;
  const val=DF.rows[gi][ci]; const input=document.createElement('input'); input.className='cell-edit';
  input.value=val===null?'':String(val); input.setAttribute('aria-label','Edit cell');
  td.innerHTML=''; td.appendChild(input); input.focus(); input.select();
  let done=false;
  const commit=()=>{ if(done)return; done=true; pushUndo(t('mCellEdited'));
    DF.rows[gi][ci]=coerceCell(input.value,DF.types[ci]);
    if(DF.types[ci]==='n'){ const inferred=inferType(DF.rows.map(r=>r[ci])); if(inferred!=='n'){ DF.rows[gi][ci]=input.value===''?null:String(input.value); DF.types[ci]='s'; } }
    log(t('mCellEdited')); renderTable(); };
  input.onkeydown=e=>{ if(e.key==='Enter'){ commit(); } else if(e.key==='Escape'){ done=true; renderTable(); } };
  input.onblur=commit; }

function gridHTML(cols,rows,opts){ opts=opts||{}; const cap=opts.cap||PREVIEW_CAP; const show=rows.length>cap; const slice=show?rows.slice(0,cap):rows;
  const colW=(100/cols.length)+'%'; const numKeys=opts.numKeys||[];
  let h='<div class="tbl-wrap" style="max-height:320px;border:1px solid var(--line);border-radius:10px">';
  h+='<table class="grid"><colgroup>'+cols.map(()=>'<col style="width:'+colW+'">').join('')+'</colgroup><thead><tr>';
  cols.forEach((c,ci)=>{ h+='<th'+(numKeys.includes(ci)?' class="num"':'')+'><span class="thc">'+esc(c)+'</span></th>'; });
  h+='</tr></thead><tbody>';
  slice.forEach(r=>{ h+='<tr>'; cols.forEach((c,ci)=>{ const v=r[ci];
    if(v===null||v===undefined||v==='')h+='<td><span class="tdc"><span class="null">—</span></span></td>';
    else if(typeof v==='number')h+='<td class="num"><span class="tdc">'+fmt(v)+'</span></td>';
    else h+='<td><span class="tdc val-str">'+esc(v)+'</span></td>'; }); h+='</tr>'; });
  h+='</tbody></table></div>';
  if(show)h+='<div style="font-size:12px;color:var(--muted);margin-top:6px">'+t('resShowFirst',{n:cap,t:rows.length})+'</div>';
  return h; }
function corrHTML(r){ const names=r.names,mat=r.mat;

  h+='<div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table class="grid" style="width:auto;min-width:100%"><colgroup><col style="width:150px">'+names.map(()=>'<col style="width:90px">').join('')+'</colgroup><thead><tr><th class="idx"></th>';
  names.forEach(n=>h+='<th class="num"><span class="thc">'+esc(n)+'</span></th>'); h+='</tr></thead><tbody>';
  mat.forEach((row,a)=>{ h+='<tr><td class="tdc idx" style="text-align:left">'+esc(names[a])+'</td>';
    row.forEach(v=>{ if(v===null)h+='<td class="num"><span class="tdc">—</span></td>';
      else{ const bg=v>=0?'rgba(14,143,124,'+(0.08+Math.abs(v)*0.55)+')':'rgba(195,68,47,'+(0.08+Math.abs(v)*0.55)+')';
        h+='<td class="num" style="background:'+bg+'"><span class="tdc" style="font-weight:600">'+v.toFixed(2)+'</span></td>'; } });

function renderRes(){ const el=document.getElementById('resArea'); if(!RESULT){ el.innerHTML='<div class="empty">'+ICONS.info+'<div>'+t('resEmpty')+'</div></div>'; return; }
  const r=RESULT; let h='';
  if(r.kind==='table'){ h+='<div class="res-note"><span class="tag">'+esc(r.title)+'</span><span>'+t('resRows',{n:r.rows.length,c:r.columns.length})+'</span>';
    if(r.opts&&r.opts.settable)h+='<button class="btn sm primary" onclick="setResultAsData()">'+t('resSetAsData')+'</button>';
    if(r.opts&&r.opts.chartable)h+='<button class="btn sm" onclick="quickChart()">'+ICONS.chart+t('resChartIt')+'</button>';
    h+='</div>'+gridHTML(r.columns,r.rows,{numKeys:r.opts&&r.opts.numKeys}); }
  else if(r.kind==='describe'){ h+='<div class="res-note"><span class="tag">describe()</span><span>'+t('resRows',{n:r.rows.length,c:r.columns.length})+'</span></div>';
    h+=gridHTML(['stat',...r.columns],r.rows.map(x=>[x.__stat,...r.columns.map(c=>x[c])]),{numKeys:r.columns.map((_,i)=>i+1)}); }
  else if(r.kind==='info'){ const ic=LANG==='cn'?['列名','类型','非空','缺失','缺失占比','唯一值']:['Column','Type','Non-null','Missing','Missing %','Unique'];
    h+='<div class="res-note"><span class="tag">info()</span><span>'+t('resRows',{n:r.summary.rows,c:r.summary.cols})+' · '+t('sMissing')+': '+r.summary.nullTotal+'</span></div>';
    h+=gridHTML(ic,r.cols.map(x=>[x.name,x.type,x.nonNull,x.nullCount,x.pct.toFixed(1)+'%',x.unique]),{numKeys:[2,3,5]}); }
  else if(r.kind==='corr'){ h+=corrHTML(r); }
  else if(r.kind==='msg'){ h+='<div class="res-note"><span class="tag">'+esc(r.title)+'</span></div><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px">'+esc(r.text)+'</pre>'; }
  el.innerHTML=h; }

  setData(makeDF(RESULT.columns,RESULT.rows),RESULT.title); log(t('mSetAsData')); renderAll(); toast(t('mSetAsData')); }

  const types=colTypes(RESULT.columns,RESULT.rows); const nf=types.map((x,i)=>x==='n'?i:-1).filter(i=>i>=0);

/* ===== Chart 数据源与渲染 ===== */
function srcData(){ if(CHART.src==='result'&&RESULT&&RESULT.kind==='table')return {cols:RESULT.columns,rows:RESULT.rows};
  return DF?{cols:DF.columns,rows:DF.rows}:null; }
function colTypes(cols,rows){ return cols.map((_,i)=>inferType(rows.map(r=>r[i]))); }
function selHtml(id,opts,cur,label,multi){ const optsTxt=opts.map(o=>'<option value="'+o.v+'"'+(o.v===cur?' selected':'')+'>'+esc(o.l)+(o.n?' (N)':'')+'</option>').join('');
  return '<div class="field'+(multi?' grow':'')+'"><label>'+label+'</label><select class="in'+(multi?' in-multi':'')+'" id="'+id+'"'+(multi?' multiple size="3"':'')+'>'+optsTxt+'</select></div>'; }
function renderChartCtl(){ const el=document.getElementById('chartArea'); const sd=srcData();
  if(!sd){ el.innerHTML='<div class="empty">'+ICONS.chart+'<div>'+t('mNoData')+'</div></div>'; return; }
  const types=colTypes(sd.cols,sd.rows);
  const numOnly=(CHART.type==='hist'||CHART.type==='scatter');
  const xOpts=sd.cols.map((c,i)=>types[i]==='n'?{v:i,l:c,n:true}:{v:i,l:c});
  if(numOnly){ const onlyN=xOpts.filter(o=>o.n); if(!onlyN.length){ el.innerHTML='<div class="empty">'+ICONS.chart+'<div>'+t('noNumeric')+'</div></div>'; return; } }
  let xv=CHART.x; if(!xOpts.some(o=>o.v===xv))xv=(numOnly?xOpts.filter(o=>o.n):xOpts)[0].v; CHART.x=xv;
  const hasRes=RESULT&&RESULT.kind==='table';
  const cX=(numOnly?xOpts.filter(o=>o.n):xOpts);
  let h='<div class="ctl">';
  h+='<div class="field"><label>'+t('srcLbl')+'</label><select class="in" id="cSrc"><option value="0">'+t('srcMain')+'</option>'+(hasRes?'<option value="1">'+t('srcResult')+'</option>':'')+'</select></div>';
  h+='<div class="field"><label>'+t('typeLbl')+'</label><select class="in" id="cType"><option value="line">'+t('cLine')+'</option><option value="bar">'+t('cBar')+'</option><option value="pie">'+t('cPie')+'</option><option value="scatter">'+t('cScatter')+'</option><option value="hist">'+t('cHist')+'</option></select></div>';
  h+=selHtml('cX',cX,xv,t('xLbl'));
  if(CHART.type==='hist'){ h+='<div class="field"><label>'+t('binsLbl')+'</label><input class="in" id="cBins" type="number" min="2" max="100" value="'+(CHART.bins||10)+'"></div>'; }
  else{ const yOpts=sd.cols.map((c,i)=>({v:i,l:c,n:types[i]==='n'}));
    const ySel=(CHART.y&&CHART.y.length?CHART.y:[CHART.y&&CHART.y[0]!==undefined?CHART.y[0]:1]).filter(i=>i<sd.cols.length);
    if(!ySel.length)ySel.push(yOpts.filter(o=>o.n)[0]?yOpts.filter(o=>o.n)[0].v:0);
    CHART.y=ySel;
    const yOptsTxt=yOpts.map(o=>'<option value="'+o.v+'"'+(ySel.includes(o.v)?' selected':'')+'>'+esc(o.l)+(o.n?' (N)':'')+'</option>').join('');
    h+='<div class="field grow"><label>'+t('yLbl')+'</label><select class="in in-multi" id="cY" multiple size="3">'+yOptsTxt+'</select></div>';
    h+='<div class="field"><label>'+t('groupLbl')+'</label><select class="in" id="cG"><option value="-1">—</option>'+sd.cols.map((c,i)=>'<option value="'+i+'"'+(i===CHART.group?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>';
    h+='<label class="check-line"><input type="checkbox" id="cAgg"'+(CHART.agg?' checked':'')+'>'+t('aggLbl')+'</label>';
    if(CHART.type==='bar')h+='<label class="check-line"><input type="checkbox" id="cStack"'+(CHART.stack?' checked':'')+'>'+t('stackLbl')+'</label>'; }
  h+='<button class="btn primary" onclick="renderChart()">'+ICONS.play+t('renderBtn')+'</button></div><div id="chartBox"></div>';
  el.innerHTML=h;
  document.getElementById('cSrc').value=CHART.src==='result'?'1':'0';
  document.getElementById('cType').value=CHART.type;
  document.getElementById('cSrc').onchange=()=>{ CHART.src=document.getElementById('cSrc').value==='1'?'result':'main'; renderChartCtl(); };
  document.getElementById('cType').onchange=()=>{ CHART.type=document.getElementById('cType').value; renderChartCtl(); };
  document.getElementById('cX').onchange=()=>{ CHART.x=+document.getElementById('cX').value; renderChart(); };
  const yEl=document.getElementById('cY'); if(yEl)yEl.onchange=()=>{ CHART.y=[...yEl.selectedOptions].map(o=>+o.value); renderChart(); };
  const gEl=document.getElementById('cG'); if(gEl)gEl.onchange=()=>{ CHART.group=+gEl.value; renderChart(); };
  const aEl=document.getElementById('cAgg'); if(aEl)aEl.onchange=()=>{ CHART.agg=aEl.checked; renderChart(); };
  const sEl=document.getElementById('cStack'); if(sEl)sEl.onchange=()=>{ CHART.stack=sEl.checked; renderChart(); };
  const bEl=document.getElementById('cBins'); if(bEl)bEl.onchange=()=>{ CHART.bins=+bEl.value||10; renderChart(); };
  renderChart(); }
function renderChart(){ const box=document.getElementById('chartBox'); if(!box)return; const sd=srcData(); if(!sd)return;
  const types=colTypes(sd.cols,sd.rows); const type=CHART.type; let option=null;
  if(type==='hist'){ const ci=CHART.x; const arr=sd.rows.map(r=>numVal(r[ci])).filter(v=>v!==null);
    if(!arr.length){ toast(t('mNeedNum'),true); return; }
    const min=Math.min(...arr),max=Math.max(...arr),bins=Math.max(2,CHART.bins||10); const w=(max-min)/bins||1;
    const counts=new Array(bins).fill(0); arr.forEach(v=>{ let b=Math.floor((v-min)/w); if(b>=bins)b=bins-1; counts[b]++; });
    option={tooltip:{trigger:'axis',confine:true},grid:{left:50,right:20,top:30,bottom:44},
      xAxis:{type:'category',data:counts.map((_,i)=>fmt(min+i*w)+'~'+fmt(min+(i+1)*w)),axisLabel:{rotate:30,fontFamily:'JetBrains Mono,monospace'}},
      yAxis:{type:'value',axisLabel:{fontFamily:'JetBrains Mono,monospace'}},
      series:[{type:'bar',data:counts,itemStyle:{color:'#0E8F7C'},barMaxWidth:38}]}; }
  else if(type==='pie'){ const x=CHART.x,y=CHART.y[0]; const map={};
    sd.rows.forEach(r=>{ const k=String(r[x]??''); const v=numVal(r[y]); if(v!==null)map[k]=(map[k]||0)+v; });
    let data=Object.entries(map).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
    if(data.length>5){ toast(t('pieCap'));
      option={tooltip:{trigger:'axis',confine:true},grid:{left:50,right:20,top:30,bottom:44},
        xAxis:{type:'category',data:data.map(d=>d.name),axisLabel:{rotate:30}},
        yAxis:{type:'value',axisLabel:{fontFamily:'JetBrains Mono,monospace'}},
        series:[{type:'bar',data:data.map(d=>d.value),itemStyle:{color:'#0E8F7C'},barMaxWidth:36}]}; }
    else option={tooltip:{trigger:'item',confine:true},legend:{bottom:0,type:'scroll'},
      series:[{type:'pie',radius:['36%','64%'],center:['50%','44%'],data,label:{formatter:'{b}\n{c}'},itemStyle:{borderRadius:4,borderColor:'#fff'},color:CHART_COLORS}]}; }
  else { const x=CHART.x; const ys=CHART.y.filter(i=>types[i]==='n'&&i<sd.cols.length);
    if(!ys.length){ toast(t('mNeedNum'),true); return; }
    const group=CHART.group; const cats=[...new Set(sd.rows.map(r=>String(r[x]??'')))];
    const series=[]; const sType=type==='scatter'?'scatter':(type==='bar'?'bar':'line');
    const build=(gVal,gName)=>{ const rows=sd.rows.filter(r=>group<0||String(r[group]??'')===gVal);
      ys.forEach(yi=>{ let data;
        if(type==='scatter')data=rows.map(r=>[numVal(r[x]),numVal(r[yi])]).filter(p=>p[0]!==null&&p[1]!==null);
        else if(CHART.agg){ const m={}; rows.forEach(r=>{ const k=String(r[x]??''); const v=numVal(r[yi]); if(v!==null)m[k]=(m[k]||0)+v; }); data=cats.map(c=>m[c]??0); }
        else data=cats.map(c=>{ const hit=rows.find(r=>String(r[x]??'')===c); const v=hit?numVal(hit[yi]):null; return v===null?0:v; });
        const ci=series.length%CHART_COLORS.length;
        const s={name:group<0?sd.cols[yi]:(gName+' · '+sd.cols[yi]),type:sType,data,itemStyle:{color:CHART_COLORS[ci]},lineStyle:{width:2},symbolSize:8};
        if(type==='bar'){ s.barMaxWidth=34; if(CHART.stack&&group>=0)s.stack='g'; }
        series.push(s); }); };
    if(group<0)build(null,'');
    else [...new Set(sd.rows.map(r=>String(r[group]??'')))].forEach(g=>build(g,g));
    option={tooltip:{trigger:type==='scatter'?'item':'axis',confine:true},legend:{top:0,type:'scroll'},
      grid:{left:55,right:20,top:38,bottom:44},
      xAxis:type==='scatter'?{type:'value',axisLabel:{fontFamily:'JetBrains Mono,monospace'}}:{type:'category',data:cats,axisLabel:{rotate:cats.length>7?30:0,fontFamily:'JetBrains Mono,monospace'}},
      yAxis:{type:'value',axisLabel:{fontFamily:'JetBrains Mono,monospace'}},series}; }
  if(!option)return;
  if(!chartInst){ chartInst=echarts.init(box); window.addEventListener('resize',()=>chartInst&&chartInst.resize()); }
  chartInst.setOption(option,true); }

function onRightSrc(){ const v=document.getElementById('rSrc').value; const hint=document.getElementById('rSrcHint'); const rf=document.getElementById('rFile');

function loadDefault(){ if(DF)pushUndo(t('mReset'));
  setData(makeDF(DEFAULT_SALES.columns,DEFAULT_SALES.rows),DEFAULT_SALES.name);
  log(t('mLoaded')); renderAll(); toast(t('mLoaded')); closeModal(); }
function resetData(){ loadDefault(); }
function doUndo(){ if(!UNDO.length)return; const u=UNDO.pop(); DF=u.df; DF_NAME=u.name; PAGE=0; HDR_SORT={idx:-1,dir:'none'};
  log(t('mUndone')); renderAll(); toast(t('mUndone')); }
function handleFile(file){ const name=(file.name||'').toLowerCase();
  const reader=new FileReader();
  reader.onload=ev=>{ try{ let df;
      if(name.endsWith('.json'))df=parseJSONText(ev.target.result);
      else df=loadFromRows(parseCSVRows(ev.target.result),true);
      if(!df.rows.length)throw new Error('empty');
      pushUndo(t('mUploaded')); setData(df,file.name||'data.csv'); log(t('mUploaded')+' · '+(file.name||''));
      renderAll(); toast(t('mParsed',{r:df.rows.length,c:df.columns.length}));
    }catch(err){ toast(name.endsWith('.json')?t('mJsonErr',{e:err.message}):t('mCsvErr'),true); } };
  reader.readAsText(file); }
function handleRightFile(input){ const f=input.files&&input.files[0]; if(!f)return; const name=(f.name||'').toLowerCase();
  const reader=new FileReader();
  reader.onload=ev=>{ try{ const df=name.endsWith('.json')?parseJSONText(ev.target.result):loadFromRows(parseCSVRows(ev.target.result),true);
      RIGHT_TMP={df,name:f.name}; toast(t('mParsed',{r:df.rows.length,c:df.columns.length})); renderRightKeys();
    }catch(err){ toast(t('mCsvErr'),true); } };
  reader.readAsText(f); }
function triggerUpload(){ document.getElementById('fileInput').click(); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }

/* ============================================================
   renderAll / init
============================================================ */
function renderAll(){ renderTopbar(); renderSidebar(); renderStats(); renderTable(); renderTabs(); renderTabBody(); }
function init(){
  document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay')closeModal(); });
  document.getElementById('fileInput').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f)handleFile(f); e.target.value=''; });
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f)handleFile(f); });
  document.addEventListener('change',e=>{ if(e.target&&e.target.id==='rFile'){ const f=e.target.files&&e.target.files[0]; if(f)handleRightFile(e.target); e.target.value=''; } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
  setLang(LANG);
  loadDefault();
}
init();
</script>
